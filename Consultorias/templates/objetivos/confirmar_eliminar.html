{% extends 'PlantillaGeneral.html' %}

{% block title %}Eliminar Objetivo - Mentor{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-5">
    <div class="card border-0 shadow-lg rounded-4 p-4 text-center">
      <div class="card-body">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3 d-block"></i>
        <h4 class="fw-bold mb-2">¿Eliminar Hito de Negocio?</h4>
        <p class="text-muted mb-4">¿Está seguro que desea eliminar el hito <strong>{{ objetivo.titulo }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'Consultorias:plan_trabajo' %}" class="btn btn-secondary rounded-pill px-4">Cancelar</a>
            <button type="submit" class="btn btn-danger rounded-pill px-4">Eliminar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

services:
  - type: web
    name: gestor-consultorias
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py poblar_datos && python manage.py collectstatic --noinput"
    startCommand: "gunicorn GestorConsultorias.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: gestor-db
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: gestor-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: gestor-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gestor-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: gestor-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gestor-db
          property: port

databases:
  - name: gestor-db
    plan: free
